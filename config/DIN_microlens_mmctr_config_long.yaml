base_config: ./config/din_config/
base_expid: DIN_default
dataset_id: MicroLens_1M_x2f

dataset_config:
    MicroLens_1M_x2f:
        data_root: ./data/
        data_format: parquet
        train_data: ./data/MicroLens_1M_x2f/train.parquet
        valid_data: ./data/MicroLens_1M_x2f/valid.parquet
        test_data: ./data/MicroLens_1M_x2f/test_unlabeled.parquet
        item_info: ./data/MicroLens_1M_x2f/item_info.parquet
        rebuild_dataset: False
        feature_cols:
            - {name: user_id, active: True, dtype: int, type: meta}
            - {name: hist_seq, active: True, dtype: int, type: meta}
            - {name: likes_level, active: True, dtype: int, type: categorical, vocab_size: 11}
            - {name: views_level, active: True, dtype: int, type: categorical, vocab_size: 11}
            - {name: item_id, active: True, dtype: int, type: categorical, vocab_size: 91718, source: item}
            - {name: item_tags, active: True, dtype: int, type: sequence, max_len: 5, vocab_size: 11740, source: item}
            - {name: item_emb_d128, active: True, dtype: float, type: embedding, source: item, pretrain_dim: 128}
        label_col: {name: label, dtype: float}

tuner_space:
    embedding_dim: 64
    embedding_regularizer: 1.e-6
    net_regularizer: 0
    net_dropout: 0.1
    dnn_hidden_units: [[1024, 512, 256]]
    din_use_softmax: true
    learning_rate: 1.e-3
    batch_size: 8192
    epochs: 10
